<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gpi_blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="gpi_yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>
    <filter id="gpi_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Rounded Tile -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />

  <g transform="translate(14, 18)" filter="url(#gpi_shadow)">
    <!-- Blue Character Bubble -->
    <rect x="0" y="4" width="46" height="42" rx="16" fill="url(#gpi_blueGrad)" />
    <polygon points="14,46 22,46 12,56" fill="#0077b6" />
    <!-- Eyes -->
    <circle cx="15" cy="22" r="3.2" fill="#ffffff" />
    <circle cx="15.5" cy="22" r="1.6" fill="#023e8a" />
    <circle cx="31" cy="22" r="3.2" fill="#ffffff" />
    <circle cx="31.5" cy="22" r="1.6" fill="#023e8a" />
    <!-- Happy Smile -->
    <path d="M 17 29 Q 23 35 29 29" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />

    <!-- Yellow Character Bubble -->
    <g transform="translate(28, 16)">
      <rect x="0" y="0" width="44" height="40" rx="15" fill="url(#gpi_yellowGrad)" />
      <polygon points="24,40 32,40 36,50" fill="#ffb703" />
      <!-- Eyes -->
      <circle cx="14" cy="18" r="3.2" fill="#023e8a" />
      <circle cx="29" cy="18" r="3.2" fill="#023e8a" />
      <!-- Open Smile -->
      <path d="M 15 24 Q 21.5 32 28 24 Z" fill="#d90429" />
    </g>

    <!-- Paper Airplane -->
    <g transform="translate(56, -6) rotate(18)">
      <polygon points="0,16 20,4 14,20 9,16" fill="#ffffff" />
      <polygon points="9,16 20,4 14,20" fill="#cbd5e1" />
      <polygon points="9,16 11,19 14,20" fill="#00b4d8" />
    </g>
  </g>
</svg>
