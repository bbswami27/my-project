name: Build Signed GitPit APK

on:
  push:
    branches: [gitpit-v114-testing]
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.GITPIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GITPIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GITPIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GITPIT_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing GITPIT_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing GITPIT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing GITPIT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing GITPIT_KEY_PASSWORD"; exit 1; }

      - name: Restore GitPit signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GITPIT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gitpit-upload-key.jks"

      - name: Install Dependencies
        run: npm ci

      - name: Validate v1.1.9 JavaScript before build
        run: |
          node --check services/emailOtp.js
          node --check server.js
          node --check server-bootstrap.js
          node --check prepare-client-v2.js
          node --check public/js/post-auth-repairs-v15.js
          node --check public/js/v112-final-repair.js
          node --check public/js/message-delivery-v4.js
          node --check public/js/call-reliability-v5.js
          node --check public/js/status-reliability-v6.js
          node --check public/js/screen-share-recipient-v9.js
          npm run test:ui
          grep -q 'versionCode 19' android/app/build.gradle
          grep -q 'versionName "1.1.9"' android/app/build.gradle
          echo "GitPit v1.1.9 validation passed"

      - name: Prepare Consolidated v1.1.9 Client
        run: npm run prepare-client

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Signed Release APK
        env:
          GITPIT_KEYSTORE_PATH: ${{ runner.temp }}/gitpit-upload-key.jks
          GITPIT_KEYSTORE_PASSWORD: ${{ secrets.GITPIT_KEYSTORE_PASSWORD }}
          GITPIT_KEY_ALIAS: ${{ secrets.GITPIT_KEY_ALIAS }}
          GITPIT_KEY_PASSWORD: ${{ secrets.GITPIT_KEY_PASSWORD }}
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GitPit-v1.1.9.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitPit-Android-v1.1.9
          path: GitPit-v1.1.9.apk

