name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatterPatter-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "ChatterPatter Android App APK (Latest)"
          body: |
            ### 📱 ChatterPatter Android APK
            Aap is APK file ko download karke apne Android phone me install kar sakte hain aur apne dosto ko share kar sakte hain!
            
            - **App Name:** ChatterPatter
            - **Version:** 1.0.0
            - **Features:** Real-time Chat, AI Assistant, HD Video Calls, Screen Sharing, Live News Flash
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
