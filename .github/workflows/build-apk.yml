name: Build Signed GitPit APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.GITPIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GITPIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GITPIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GITPIT_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing GITPIT_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing GITPIT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing GITPIT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing GITPIT_KEY_PASSWORD"; exit 1; }

      - name: Restore GitPit signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GITPIT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gitpit-upload-key.jks"

      - name: Install Dependencies
        run: npm install

      - name: Prepare Contacts-Stage v1.0.8 Client
        run: npm run prepare-client

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Signed Release APK
        env:
          GITPIT_KEYSTORE_PATH: ${{ runner.temp }}/gitpit-upload-key.jks
          GITPIT_KEYSTORE_PASSWORD: ${{ secrets.GITPIT_KEYSTORE_PASSWORD }}
          GITPIT_KEY_ALIAS: ${{ secrets.GITPIT_KEY_ALIAS }}
          GITPIT_KEY_PASSWORD: ${{ secrets.GITPIT_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GitPit-v1.0.8.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitPit-Android-v1.0.8
          path: GitPit-v1.0.8.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GitPit Android App APK (Latest)"
          body: |
            ### GitPit Android APK v1.0.8
            Staged contacts repair on top of the verified responsive v1.0.7 baseline.

            - App Name: GitPit
            - Package: com.chatterpatter.app
            - Build label: 1.0.8
            - Version code: 8
            - Enables only identity routing, phone-contact refresh/registration matching, and New Chat contact directory after login.
            - Messaging/calls/status/UI repair modules remain disabled until this stage passes device testing.
          files: GitPit-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
