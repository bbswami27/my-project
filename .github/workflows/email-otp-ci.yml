name: GitPit Email OTP CI
on:
  push:
    branches:
      - gitpit-v114-testing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-email-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Validate updated JavaScript syntax
        run: |
          node --check server.js
          node --check database.js
          node --check server-bootstrap.js
          node --check services/emailOtp.js
          node -e "new Function(require('fs').readFileSync('google-apps-script/GitPitEmailOtp.gs','utf8'))"
          node --check public/js/auth.js
          node --check js/auth.js
          node --check prepare-client-v2.js
          node --check public/js/contact-directory-v5.js
          node --check public/js/v112-final-repair.js
          node --check public/js/post-auth-repairs-v15.js
          node --check public/js/message-delivery-v4.js
      - name: Run existing UI regression tests
        run: npm run test:ui
      - name: Verify canonical phonebook identity and email-only registration
        run: node tests/gitpit-identity-regression.js
      - name: Verify email routes are present and phone is optional
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('server.js','utf8');
          const email=fs.readFileSync('services/emailOtp.js','utf8');
          const ui=fs.readFileSync('public/index.html','utf8');
          for(const marker of ['/api/auth/email/send-code','/api/auth/email/verify-code','EMAIL_TEST_ALLOWLIST','timingSafeEqual']) {
            if (!email.includes(marker)) throw new Error('Missing secure OTP behavior: '+marker);
          }
          if (!server.includes('emailVerified') || !ui.includes('email-code-input')) throw new Error('Email login UI or session support missing');
          if (!ui.includes('auth-panel-email')) throw new Error('Email panel missing');
          if (!email.includes('GMAIL_SCRIPT_URL') || !email.includes('GMAIL_SCRIPT_SECRET') || !email.includes('gmail_script')) throw new Error('Missing HTTPS Gmail relay integration');
          const directory=fs.readFileSync('public/js/v112-final-repair.js','utf8');
          const activeLoader=fs.readFileSync('public/js/post-auth-repairs-v15.js','utf8');
          if(!directory.includes('u.phoneVerified||u.emailVerified')) throw new Error('Email-only registered users missing from active new-chat directory');
          if(!directory.includes('d10(u.phone)&&d10(c.phone)')) throw new Error('Blank-phone chat collision not fixed');
          if(!activeLoader.includes('v112-final-repair.js')) throw new Error('Patched directory module is not loaded');
          const db=fs.readFileSync('database.js','utf8');
          if(!db.includes('u.phoneVerified && (isSelf || !priv.hidePhone)')) throw new Error('Unverified phone leaks in contacts');
          const auth=fs.readFileSync('public/js/auth.js','utf8');
          if(!auth.includes('Phone OTP verification required')) throw new Error('Unverified phone edit not locked');
          const chat=fs.readFileSync('public/js/chat.js','utf8');
          for(const marker of ['bindAccountChats','gitpit_chats_account_','restoreServerConversations']) {
            if(!chat.includes(marker))throw new Error('Account-scoped chat persistence missing: '+marker);
          }
          if(!server.includes('/api/conversations'))throw new Error('Durable chat recovery API missing');
          if(!db.includes('emailVerified && emails.includes'))throw new Error('Verified email matching missing');
          if(!directory.includes('emails:true') || !directory.includes('/api/contacts/sync'))throw new Error('Native saved email matching missing');
          if(auth.includes('this.logout(false)'))throw new Error('Destructive automatic logout on app resume still present');
          const native=fs.readFileSync('android/app/src/main/java/com/chatterpatter/app/ContactsPlugin.java','utf8');
          const main=fs.readFileSync('android/app/src/main/java/com/chatterpatter/app/MainActivity.java','utf8');
          if(!native.includes('CommonDataKinds.Email.CONTENT_ITEM_TYPE'))throw new Error('Native phonebook still ignores email-only contacts');
          if(main.includes('requestAllPermissions();'))throw new Error('App still asks for all permissions on startup');
          if(!db.includes('emailVerified: !!row.email_verified'))throw new Error('Server restart loses email verification flag');
          console.log('Email OTP integration checks passed.');
          NODE
